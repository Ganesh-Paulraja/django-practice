<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: sans-serif;
        }
        .gg-welcome {
            background-color: #b1dcfd;
            width: 300px;
            height: 160px;
            border: 2px dashed #1c6fc4;
            border-radius: 5px;
            margin: 0 auto;
        }
        .gg-inner {
            color: #1c6fc4;
            margin: 0 auto;
            font-size: 30px;
            width: 200px;
            border-bottom: 2px solid #1c6fc4;
            text-align: center;
            padding-bottom: 3px;
            padding-top: 30px;
        }
        .gg-bottom {
            font-size: 20px;
            color: #1c6fc4;
            text-align: center;
            padding-top: 10px;
        }

    </style>
</head>

<body>
    <div class="gg-welcome">
        <div class="gg-inner">
        Welcome
        </div>
        <div class="gg-bottom">
            This is my card
        </div>
    </div>
</body>
</html>
